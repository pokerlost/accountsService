apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pokerlost.service.fullname" . }}
  labels:
    {{- include "pokerlost.service.labels" . | nindent 4 }}
data:
  ACCOUNTSSERVICE_ROOT_OPERATION: {{ required "rootOperation is required" .Values.rootOperation | quote }}
  ACCOUNTSSERVICE_OPENAPI_OPERATION: {{ required "openapiOperation is required" .Values.openapiOperation | quote }}
  {{- range $name, $value := .Values.environment }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
