replicaCount: 1

image:
  pullPolicy: IfNotPresent

environment:
  ACCOUNTSSERVICE_LOGLEVEL: INFO

secretEnvironment:
  DATABASE_URL:
    enabled: true
    name: accountsservice-local-runtime
    key: database-url

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi
