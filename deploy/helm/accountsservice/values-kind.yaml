replicaCount: 1

image:
  pullPolicy: IfNotPresent

environment:
  ACCOUNTSSERVICE_APPLICATION__ENVIRONMENT: development
  ACCOUNTSSERVICE_APPLICATION__VERSION: "0.1.0"
  ACCOUNTSSERVICE_LOGFIRE__ENABLED: "true"
  ACCOUNTSSERVICE_LOGFIRE__SEND_TO_LOGFIRE: "false"
  ACCOUNTSSERVICE_LOGFIRE__CONSOLE: "true"
  ACCOUNTSSERVICE_LOGFIRE__MINIMUM_LEVEL: info
  ACCOUNTSSERVICE_BUSINESS_OPERATION_FINGERPRINT__KEY_VERSION: "1"

secretEnvironment:
  ACCOUNTSSERVICE_LOGFIRE__TOKEN:
    enabled: false
  ACCOUNTSSERVICE_DATABASE__URL:
    enabled: true
    name: accountsservice-local-runtime
    key: database-url
  ACCOUNTSSERVICE_BUSINESS_OPERATION_FINGERPRINT__SECRET:
    enabled: true
    name: accountsservice-local-runtime
    key: business-operation-fingerprint-secret

gunicorn:
  workers: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi
