[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pokerlost-accountsservice"
version = "0.1.0"
description = "Pokerlost human-account service foundation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic-settings>=2.12,<3",
    "pypokerlost",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.17,<2",
]

[tool.uv.sources]
pypokerlost = { git = "ssh://git@github.com/pokerlost/pypokerlost.git", rev = "8652cc850ccef8a00538ba6ff0b545ff7f3d38af" }

[dependency-groups]
dev = ["mypy>=2.3,<2.4", "pre-commit==4.6.2", "ruff==0.16.4", "pytest>=9,<10", "pytest-cov>=7,<8", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/accountsservice"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations/versions"]
line-length = 88
src = ["src", "scripts", "migrations"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["accountsservice"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/accountsservice", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
markers = ["unit: isolated unit tests", "integration: external dependency tests", "contract: public contract tests"]
